<div class="min-h-[calc(100vh-4rem)] flex items-center justify-center px-4 py-12 animate-fade-in-up">
  <div class="w-full max-w-md">
    <!-- Header -->
    <div class="text-center mb-8">
      <div class="text-5xl mb-4">🏆</div>
      <h1 class="font-display text-3xl font-bold text-white mb-2">Crea tu cuenta</h1>
      <p class="text-slate-400 text-sm">Únete a la porra y demuestra que eres el que más sabe</p>
    </div>

    <!-- Form Card -->
    <div class="glass-card p-8">
      @if (auth.registerError()) {
        <div class="mb-6 p-3 rounded-lg bg-rose-500/10 border border-rose-500/20 text-rose-400 text-sm animate-slide-down" id="register-error">
          {{ auth.registerError() }}
        </div>
      }

      <form (ngSubmit)="onSubmit()" class="space-y-5">
        <div>
          <label for="register-nombre" class="block text-sm font-medium text-slate-300 mb-1.5">Nombre de usuario</label>
          <input
            id="register-nombre"
            type="text"
            [(ngModel)]="nombre"
            name="nombre"
            class="input-field"
            placeholder="Elige un nombre"
            autocomplete="username"
            required
          />
        </div>

        <div>
          <label for="register-password" class="block text-sm font-medium text-slate-300 mb-1.5">Contraseña</label>
          <input
            id="register-password"
            type="password"
            [(ngModel)]="password"
            name="password"
            class="input-field"
            placeholder="Mínimo 4 caracteres"
            autocomplete="new-password"
            required
          />
        </div>

        <div>
          <label for="register-confirm" class="block text-sm font-medium text-slate-300 mb-1.5">Confirmar contraseña</label>
          <input
            id="register-confirm"
            type="password"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            class="input-field"
            [class.!border-rose-500]="passwordMismatch"
            placeholder="Repite la contraseña"
            autocomplete="new-password"
            required
          />
          @if (passwordMismatch) {
            <p class="text-rose-400 text-xs mt-1 animate-slide-down" id="register-mismatch-error">Las contraseñas no coinciden</p>
          }
        </div>

        <button
          type="submit"
          class="btn-primary w-full !py-3 !text-base"
          [disabled]="!canSubmit"
          id="register-submit-btn"
        >
          Registrarse
        </button>
      </form>

      <div class="mt-6 text-center">
        <p class="text-sm text-slate-400">
          ¿Ya tienes cuenta?
          <a routerLink="/login" class="text-accent-400 hover:text-accent-300 font-medium transition-colors" id="register-login-link">
            Inicia sesión
          </a>
        </p>
      </div>
    </div>
  </div>
</div>
