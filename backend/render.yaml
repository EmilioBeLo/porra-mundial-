services:
  - type: web
    name: porra-mundial-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./porra_mundial.db
      - key: CORS_ORIGINS
        value: https://*.vercel.app
